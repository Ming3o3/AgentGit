name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/dsh-agentgit/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Harness plugin dependencies
        run: npm ci --prefix packages/dsh-agentgit

      - name: Build Harness plugin
        run: npm run build:dsh

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run lint

      - name: Check plugin package
        run: npm run lint --prefix packages/dsh-agentgit

      - name: Check package contents
        run: npm pack --dry-run

      - name: Check Harness plugin package contents
        run: npm pack --dry-run
        working-directory: packages/dsh-agentgit
