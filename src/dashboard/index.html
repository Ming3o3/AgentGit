<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentGit</title>
    <link rel="stylesheet" href="/assets/dashboard.css">
  </head>
  <body>
    <div class="application-shell">
      <header class="topbar">
        <div>
          <p class="product-name">AgentGit</p>
          <p class="project-path" id="project-path">Loading project...</p>
        </div>
        <div class="topbar-actions">
          <span class="health-status health-unknown" id="health-status">Checking</span>
          <time id="updated-at"></time>
          <button type="button" id="refresh">Refresh</button>
        </div>
      </header>
      <main>
        <section class="summary-strip" aria-label="Summary">
          <div><span id="event-count">0</span><small>Events</small></div>
          <div><span id="agent-count">0</span><small>Agents</small></div>
          <div><span id="pending-count">0</span><small>Pending messages</small></div>
          <div><span id="active-count">0</span><small>Active tasks</small></div>
        </section>
        <section class="alert-band" id="alert-band" aria-live="polite" hidden>
          <ul id="alerts"></ul>
        </section>
        <section class="metrics-strip" aria-label="Operational metrics">
          <div><span id="event-rate">0</span><small>Events / minute</small></div>
          <div><span id="delivery-p95">-</span><small>Delivery p95</small></div>
          <div><span id="completion-p95">-</span><small>Completion p95</small></div>
          <div><span id="storage-size">0 B</span><small>Local storage</small></div>
        </section>
        <div class="workspace-grid">
          <section class="task-section" aria-labelledby="task-heading">
            <div class="section-heading">
              <h1 id="task-heading">Tasks</h1>
              <span id="task-total"></span>
            </div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Task</th><th>Owner</th><th>Priority</th><th>Status</th><th>Updated</th></tr></thead>
                <tbody id="tasks"></tbody>
              </table>
            </div>
          </section>
          <section class="timeline-section" aria-labelledby="timeline-heading">
            <div class="section-heading">
              <h2 id="timeline-heading">Activity</h2>
              <span id="event-total"></span>
            </div>
            <div class="event-filters">
              <input id="event-search" type="search" placeholder="Search events" aria-label="Search events">
              <select id="agent-filter" aria-label="Filter by agent"><option value="">All agents</option></select>
              <select id="type-filter" aria-label="Filter by event type"><option value="">All types</option></select>
            </div>
            <ol class="timeline" id="timeline"></ol>
          </section>
          <aside class="refs-section" aria-labelledby="refs-heading">
            <div class="section-heading"><h2 id="refs-heading">Refs</h2><span id="ref-total"></span></div>
            <ul class="refs" id="refs"></ul>
          </aside>
        </div>
      </main>
    </div>
    <div class="event-dialog-backdrop" id="event-dialog" hidden>
      <section class="event-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header>
          <div><p class="dialog-label">Event context</p><h2 id="dialog-title">Event</h2></div>
          <button type="button" class="dialog-close" id="dialog-close" aria-label="Close event details" title="Close">&times;</button>
        </header>
        <dl class="event-properties" id="event-properties"></dl>
        <section class="relationship-grid" id="event-relationships"></section>
        <section class="payload-section"><h3>Payload</h3><pre id="event-payload"></pre></section>
      </section>
    </div>
    <script type="module" src="/assets/dashboard.js"></script>
  </body>
</html>
